<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pradipsinh Jadeja, Python and Django Developer, AI/LLM Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.12"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .l1{animation:in .4s ease 0.4s backwards}
      .l2{animation:in .4s ease 1.0s backwards}
      .l3{animation:in .4s ease 1.6s backwards}
      .l4{animation:in .4s ease 2.2s backwards}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes in{from{opacity:0}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#6366F1" stroke-opacity="0.35"/>

  <!-- left: identity -->
  <circle cx="82" cy="70" r="5" fill="#10B981"/>
  <text x="98" y="75" class="m" font-size="15" fill="#06B6D4">available for opportunities</text>

  <text x="60" y="150" class="t" font-size="58" font-weight="700" fill="#F8FAFC">Pradipsinh Jadeja</text>
  <text x="60" y="196" class="t" font-size="26" font-weight="600" fill="url(#accent)">Python &amp; Django Developer  |  AI/LLM Developer</text>
  <text x="60" y="232" class="t" font-size="17" fill="#94A3B8">Backend web apps, Android, and AI-powered tools. Ahmedabad, India.</text>

  <!-- tag pills -->
  <g class="m" font-size="14">
    <rect x="60" y="256" width="86" height="32" rx="16" fill="#6366F1" fill-opacity="0.16" stroke="#6366F1" stroke-opacity="0.6"/>
    <text x="103" y="277" text-anchor="middle" fill="#A5B4FC"># Python</text>
    <rect x="156" y="256" width="92" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text x="202" y="277" text-anchor="middle" fill="#C4B5FD"># Django</text>
    <rect x="258" y="256" width="96" height="32" rx="16" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.6"/>
    <text x="306" y="277" text-anchor="middle" fill="#67E8F9"># AI / LLM</text>
    <rect x="364" y="256" width="104" height="32" rx="16" fill="#94A3B8" fill-opacity="0.10" stroke="#94A3B8" stroke-opacity="0.45"/>
    <text x="416" y="277" text-anchor="middle" fill="#CBD5E1"># Android</text>
  </g>

  <!-- right: terminal card -->
  <g>
    <rect x="780" y="58" width="370" height="204" rx="14" fill="#0D1117" stroke="#6366F1" stroke-opacity="0.45"/>
    <rect x="780" y="58" width="370" height="38" rx="14" fill="#161B22"/>
    <rect x="780" y="82" width="370" height="14" fill="#161B22"/>
    <circle cx="804" cy="77" r="6" fill="#F43F5E" fill-opacity="0.85"/>
    <circle cx="824" cy="77" r="6" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="844" cy="77" r="6" fill="#10B981" fill-opacity="0.85"/>
    <text x="1135" y="82" text-anchor="end" class="m" font-size="12" fill="#64748B">portfolio.py</text>

    <g class="m" font-size="16">
      <text x="802" y="132" class="l1" fill="#94A3B8">&gt; loading <tspan fill="#A5B4FC">Python</tspan>...</text>
      <text x="802" y="164" class="l2" fill="#94A3B8">&gt; loading <tspan fill="#C4B5FD">Django</tspan>...</text>
      <text x="802" y="196" class="l3" fill="#94A3B8">&gt; loading <tspan fill="#67E8F9">AI modules</tspan>...</text>
      <text x="802" y="236" class="l4" fill="#10B981">system ready ✓<tspan class="cur" fill="#06B6D4" dx="8">▌</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
