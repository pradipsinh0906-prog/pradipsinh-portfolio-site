<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Contact: open to Python, Django, AI/ML and LLM application development roles" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B12"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0.05" r="0.6"><stop offset="0" stop-color="#6366F1" stop-opacity="0.26"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.97" cy="0.95" r="0.5"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.2"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.12"/></pattern>
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.bar{animation:grow 1.2s ease .2s backwards}
@keyframes grow{from{transform:scaleX(0)}}
.bar{transform-box:fill-box;transform-origin:left}
</style>
</defs>
<rect width="1200" height="190" rx="18" fill="url(#bg)"/>
<rect width="1200" height="190" rx="18" fill="url(#dots)"/>
<rect width="1200" height="190" rx="18" fill="url(#g1)"/>
<rect width="1200" height="190" rx="18" fill="url(#g2)"/>
<rect x="1" y="1" width="1198" height="188" rx="17" fill="none" stroke="#6366F1" stroke-opacity="0.35"/>
<text x="48" y="52" class="m" font-size="15" fill="#06B6D4">// contact</text>
<text x="48" y="100" class="t" font-size="36" font-weight="700" fill="url(#accent)">Let's build something intelligent.</text>
<text x="48" y="140" class="t" font-size="17" fill="#94A3B8">Open to opportunities in Python, Django, AI/ML and LLM application development.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
